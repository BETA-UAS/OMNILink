[tool.ruff]
line-length = 100
target-version = "py39"
src = ["core", "tests", "ui"]
extend-exclude = [
    "__pycache__",
    ".venv",
    "venv"
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
